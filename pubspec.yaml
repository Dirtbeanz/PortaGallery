name: photo_gallery
description: "PortaGallery - a modern photo gallery for external drives."
publish_to: 'none'
version: 1.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  path_provider: ^2.1.5
  path: ^1.9.0
  file_picker: ^8.1.2
  photo_view: ^0.15.0
  permission_handler: ^11.3.1
  media_kit: ^1.2.0
  media_kit_video: ^2.0.1
  media_kit_libs_android_video: ^1.3.8
  share_plus: ^10.1.4
  exif: ^3.3.0
  video_thumbnail: ^0.5.6
  media_kit_libs_linux: ^1.2.1
  image: ^4.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png